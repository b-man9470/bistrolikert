<script>
  const { useState, useEffect } = React;
  const h = React.createElement;
  const PASS = 'bistro2024';
  const DATA_URL = './menu-data.json';
  const STORAGE_KEY = 'menu-content-v1'; // gedeelde, live opgeslagen versie van de kaart
  const uid = () => Math.random().toString(36).slice(2, 9);
  const eur = (p) => `€\u00a0${Number(p).toFixed(2).replace('.', ',')}`;

  function toB64(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }
  function downloadJSON(obj, filename) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ─── Opslag-helpers ─────────────────────────────────────────────────────────
  // Alle bezoekers van deze pagina delen dezelfde opgeslagen kaart (shared = true),
  // zodat wijzigingen die de eigenaar maakt automatisch voor iedereen zichtbaar zijn.
  async function loadSharedMenu() {
    try {
      const result = await window.storage.get(STORAGE_KEY, true);
      if (result && result.value) return JSON.parse(result.value);
    } catch (e) {
      // nog geen opgeslagen versie, of storage niet beschikbaar — geen probleem
    }
    return null;
  }
  async function saveSharedMenu(payload) {
    await window.storage.set(STORAGE_KEY, JSON.stringify(payload), true);
  }

  // ─── Reservekaart (gebruikt enkel als niets anders geladen kan worden) ──────
  const FALLBACK_DATA = {
    specials: [{ id: 's1', title: 'Salade van noorse vis', description: 'Heerlijk verse Noorse vis, gecombineerd met een smaakvolle, frisse salade.', price: 32.5, photo: 'images/voorbeeld_suggestie.png' }],
    dishes: [{ id: 'd1', category: 'Lunch', items: [{ id: uid(), name: 'Steak friet met salade', description: 'Champignon- of pepersaus', price: 19.5 }] }],
    drinks: [{ id: 'r1', category: 'Frisdranken', items: [{ id: uid(), name: 'Coca-Cola / Zero', description: '', price: 3 }] }],
  };

  // ─── App ──────────────────────────────────────────────────────────────────
  function App() {
    const [view, setView] = useState('home');
    const [adv, setAdv] = useState('special');
    const [isAdmin, setIsAdmin] = useState(false);
    const [loading, setLoading] = useState(true);
    const [loadError, setLoadError] = useState(false);
    const [mobileOpen, setMobileOpen] = useState(false);
    const [dishes, setDishes] = useState([]);
    const [drinks, setDrinks] = useState([]);
    const [specials, setSpecials] = useState([]);
    const [saveState, setSaveState] = useState('idle'); // idle | saving | saved | error

    useEffect(() => {
      (async () => {
        // 1) Bestaat er al een live, eerder opgeslagen versie van de kaart? Gebruik die.
        const shared = await loadSharedMenu();
        if (shared) {
          setDishes(shared.dishes || []);
          setDrinks(shared.drinks || []);
          setSpecials(shared.specials || []);
          setLoading(false);
          return;
        }
        // 2) Anders: laad de standaardkaart uit menu-data.json.
        try {
          const res = await fetch(DATA_URL, { cache: 'no-store' });
          if (!res.ok) throw new Error('niet gevonden');
          const data = await res.json();
          setDishes(data.dishes || []);
          setDrinks(data.drinks || []);
          setSpecials(data.specials || []);
        } catch (e) {
          setLoadError(true);
          setDishes(FALLBACK_DATA.dishes);
          setDrinks(FALLBACK_DATA.drinks);
          setSpecials(FALLBACK_DATA.specials);
        }
        setLoading(false);
      })();
    }, []);

    // Elke wijziging (toevoegen/aanpassen/verwijderen) wordt meteen live opgeslagen
    // en is dus direct zichtbaar voor alle bezoekers van de site — geen download nodig.
    const persist = async (next) => {
      setSaveState('saving');
      try {
        await saveSharedMenu(next);
        setSaveState('saved');
        setTimeout(() => setSaveState((s) => (s === 'saved' ? 'idle' : s)), 2000);
      } catch (e) {
        console.error('Opslaan mislukt:', e);
        setSaveState('error');
      }
    };
    const upDishes = (v) => { setDishes(v); persist({ specials, dishes: v, drinks }); };
    const upDrinks = (v) => { setDrinks(v); persist({ specials, dishes, drinks: v }); };
    const upSpecials = (v) => { setSpecials(v); persist({ specials: v, dishes, drinks }); };
    const go = (v) => { setView(v); setMobileOpen(false); };
    const exportData = () => downloadJSON({ specials, dishes, drinks }, 'menu-data.json');

    if (loading)
      return h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', height: 300, color: 'var(--tx-on-dark-muted)', fontFamily: 'var(--f-mono)', fontSize: 13 } }, 'Menukaart laden…');

    const navItems = [['home', 'Home'], ['gerechten', 'Gerechten'], ['dranken', 'Dranken'], ['contact', 'Contact']];

    return h('div', { style: { minHeight: '100vh', display: 'flex', flexDirection: 'column', flex: 1 } },
      h('nav', { className: 'bl-nav' },
        h('div', { className: 'bl-nav-in' },
          h('span', { className: 'bl-logo', onClick: () => go('home') }, 'Bistro Likert', h('span', { className: 'dot' }, '·')),
          h('div', { className: 'bl-navlinks desktop' },
            ...navItems.map(([v, l]) => h('button', { key: v, className: 'bl-nb' + (view === v ? ' active' : ''), onClick: () => go(v) }, l))
          ),
          h('button', { className: 'bl-burger', onClick: () => setMobileOpen((o) => !o), 'aria-label': 'Menu' }, mobileOpen ? '✕' : '☰')
        ),
        h('div', { className: 'bl-navlinks mobile' + (mobileOpen ? ' open' : '') },
          ...navItems.map(([v, l]) => h('button', { key: v, className: 'bl-nb' + (view === v ? ' active' : ''), onClick: () => go(v) }, l))
        )
      ),
      h('div', { className: 'bl-main' },
        loadError && view !== 'admin' && h('div', { style: { background: 'rgba(154,59,38,0.18)', border: '1px solid var(--rust-light)', borderRadius: 12, padding: '10px 14px', fontSize: 12.5, color: 'var(--tx-on-dark)', marginBottom: '1.25rem' } }, 'menu-data.json kon niet geladen worden — reservegegevens worden getoond. Zorg dat dit bestand naast index.html staat.'),
        view === 'home' && h(HomeView, { specials, go }),
        view === 'gerechten' && h(MenuView, { data: dishes, title: 'Onze gerechten' }),
        view === 'dranken' && h(MenuView, { data: drinks, title: 'Onze dranken' }),
        view === 'contact' && h(ContactView, null),
        view === 'admin' && h(AdminView, { isAdmin, setIsAdmin, adv, setAdv, dishes, upDishes, drinks, upDrinks, specials, upSpecials, saveState, exportData })
      ),
      h('footer', { className: 'bl-footer' },
        h('p', { style: { fontFamily: 'var(--f-display)', fontStyle: 'italic', fontWeight: 500, color: 'var(--tx-on-dark)', fontSize: 18, marginBottom: 6 } }, 'Bistro Likert'),
        h('p', { style: { color: 'var(--tx-on-dark-faint)', fontSize: 13 } }, 'Gemeenteplein 8 · 1770 Liedekerke · +32 53 42 85 50'),
        !isAdmin && h('button', { onClick: () => go('admin'), style: { marginTop: 12, background: 'none', border: 'none', color: 'var(--tx-on-dark-faint)', fontSize: 11.5, cursor: 'pointer', textDecoration: 'underline', fontFamily: 'var(--f-mono)' } }, 'Eigenaar? Aanmelden')
      )
    );
  }

  // ─── Home ─────────────────────────────────────────────────────────────────
  function HomeView({ specials, go }) {
    const multi = specials.length > 1;
    return h('div', null,
      h('div', { className: 'bl-hero' },
        h('p', { className: 'bl-eyebrow' }, 'Welkom bij'),
        h('h1', null, 'Bistro ', h('em', null, 'Likert')),
        h('p', null, 'Een warm, huiselijk bistro in het hart van Liedekerke. Een keuken met een Belgisch karakter.'),
        h('div', { className: 'bl-cta-row' },
          h('button', { className: 'bl-btn bl-btn-brass', onClick: () => go('gerechten') }, 'Bekijk onze gerechten'),
          h('button', { className: 'bl-btn bl-btn-ghost', onClick: () => go('dranken') }, 'Bekijk onze dranken')
        )
      ),
      specials.length > 0 && h('div', { className: multi ? 'bl-specials-grid' : '' },
        ...specials.map((special) =>
          h('div', { key: special.id, className: 'bl-ticket' + (multi ? ' compact' : '') },
            h('div', { className: 'bl-ticket-body' },
              special.photo && h('img', { className: 'bl-ticket-photo', src: special.photo, alt: special.title }),
              h('div', { style: { flex: 1, minWidth: 180 } },
                h('span', { className: 'bl-tag' }, specials.length > 1 ? 'Suggestie' : 'Suggestie van de week'),
                h('h2', null, special.title),
                h('p', { className: 'desc' }, special.description),
                special.price && h('span', { className: 'price-stub' }, eur(special.price))
              )
            )
          )
        )
      ),
      h('div', { className: 'bl-gin' },
        h('img', { className: 'bl-gin-photo', src: 'images/gin.jpg', alt: 'Huisgemaakte Bistro Gin' }),
        h('div', { className: 'bl-gin-text' },
          h('span', { className: 'bl-tag' }, 'Onze eigen Gin'),
          h('h2', null, 'Bistro Gin'),
          h('p', null, 'Hier komt een tekstje naar wens over de Gin')
        )
      )
    );
  }

  // ─── Menu ─────────────────────────────────────────────────────────────────
  function MenuView({ data, title }) {
    return h('div', { className: 'bl-panel' },
      h('h1', { style: { fontFamily: 'var(--f-display)', fontWeight: 600, fontSize: 'clamp(1.6rem,4vw,2.1rem)', marginBottom: 8, color: 'var(--tx-on-dark)' } }, title),
      h('p', { style: { color: 'var(--tx-on-dark-muted)', fontSize: 13.5, marginBottom: '1.6rem', lineHeight: 1.7 } }, 'Alle prijzen zijn inclusief BTW. Vraag ons personeel naar allergeneninformatie.'),
      ...data.map((cat) =>
        h('div', { key: cat.id, className: 'bl-cat' },
          h('div', { className: 'bl-cat-head' }, h('span', { className: 'bl-cat-title' }, cat.category)),
          cat.note && h('p', { className: 'bl-cat-note' }, cat.note),
          ...cat.items.map((item) =>
            h('div', { key: item.id, className: 'bl-item-row', style: { flexWrap: 'wrap' } },
              h('span', { className: 'bl-item-name' }, item.name),
              h('span', { className: 'bl-item-leader' }),
              h('span', { className: 'bl-item-price' }, eur(item.price)),
              item.description && h('span', { className: 'bl-item-desc' }, item.description)
            )
          )
        )
      )
    );
  }

  // ─── Contact ──────────────────────────────────────────────────────────────
  function ContactView() {
    const cards = [
      { icon: '📍', title: 'Adres', lines: ['Gemeenteplein 8', '1770 Liedekerke, België'] },
      { icon: '📞', title: 'Telefoon', lines: ['+32 53 42 85 50'] },
      { icon: '✉️', title: 'E-mail', lines: ['info@bistrolikert.be'] },
    ];
    const hours = [
      { day: 'Maandag', lines: ['Gesloten'] },
      { day: 'Dinsdag', lines: ['Gesloten'] },
      { day: 'Woensdag', lines: ['17.30u tot 21u'] },
      { day: 'Donderdag en vrijdag', lines: ['12u tot 14u', '17.30u tot 21u'] },
      { day: 'Zaterdag', lines: ['8u tot 14u — tijdens de markt beperkte kaart van 12u tot 14u', '17.30u tot 21u'] },
      { day: 'Zondag', lines: ['12u tot 14u', '17.30u tot 21u'] },
    ];
    return h('div', { className: 'bl-panel' },
      h('h1', { style: { fontFamily: 'var(--f-display)', fontWeight: 600, fontSize: 'clamp(1.6rem,4vw,2.1rem)', marginBottom: '1.4rem', color: 'var(--tx-on-dark)' } }, 'Contact & Reservaties'),
      h('div', { className: 'bl-grid-2', style: { marginBottom: 16 } },
        ...cards.map((c) =>
          h('div', { key: c.title, className: 'bl-contact-card' },
            h('div', { className: 'bl-icon-circle' }, c.icon),
            h('p', { style: { fontWeight: 600, fontSize: 14, marginBottom: 6, color: 'var(--tx-on-dark)' } }, c.title),
            ...c.lines.map((l) => h('p', { key: l, style: { fontSize: 13, color: 'var(--tx-on-dark-muted)', lineHeight: 1.7, margin: 0 } }, l))
          )
        )
      ),
      h('div', { className: 'bl-contact-card', style: { marginBottom: 16 } },
        h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: '0.9rem' } },
          h('div', { className: 'bl-icon-circle', style: { marginBottom: 0 } }, '🕐'),
          h('span', { style: { fontWeight: 600, fontSize: 14, color: 'var(--tx-on-dark)' } }, 'Openingsuren')
        ),
        h('div', { style: { display: 'grid', gap: 0 } },
          ...hours.map((d) =>
            h('div', { key: d.day, style: { display: 'flex', flexWrap: 'wrap', gap: '4px 14px', padding: '10px 0', borderBottom: '1px solid var(--line)' } },
              h('span', { style: { fontFamily: 'var(--f-mono)', fontWeight: 600, fontSize: 12.5, color: 'var(--brass-light)', letterSpacing: '0.02em', width: 170, flexShrink: 0 } }, d.day),
              h('div', { style: { flex: 1, minWidth: 180 } },
                ...d.lines.map((l, i) => h('p', { key: i, style: { fontSize: 13, color: 'var(--tx-on-dark-muted)', lineHeight: 1.6, margin: 0 } }, l))
              )
            )
          )
        ),
        h('p', { style: { fontSize: 12, color: 'var(--tx-on-dark-faint)', fontStyle: 'italic', marginTop: '0.8rem' } }, 'Keuken sluit om 20.30u.')
      ),
      h('div', { className: 'bl-contact-card' },
        h('p', { style: { fontWeight: 600, marginBottom: 8, fontSize: 14, color: 'var(--tx-on-dark)' } }, 'Reserveren'),
        h('p', { style: { fontSize: 13, color: 'var(--tx-on-dark-muted)', lineHeight: 1.7 } }, 'Voor reservaties kunt u ons telefonisch bereiken via +32 53 42 85 50 of een e-mail sturen naar info@bistrolikert.be. Wij bevestigen zo snel mogelijk.')
      )
    );
  }

  // ─── Admin ────────────────────────────────────────────────────────────────
  function AdminView({ isAdmin, setIsAdmin, adv, setAdv, dishes, upDishes, drinks, upDrinks, specials, upSpecials, saveState, exportData }) {
    if (!isAdmin) return h(AdminLogin, { setIsAdmin });
    const tabs = [['special', '⭐ Suggesties'], ['gerechten', '🍽 Gerechten'], ['dranken', '🍷 Dranken']];

    const barClass = saveState === 'error' ? 'bl-export-bar err' : 'bl-export-bar ok';
    const barText =
      saveState === 'saving' ? '⬤ Bezig met opslaan…'
      : saveState === 'error' ? '⚠ Opslaan is mislukt. Controleer je verbinding en probeer opnieuw, of gebruik de downloadknop als back-up.'
      : '✓ Wijzigingen worden automatisch en live opgeslagen — bezoekers zien ze meteen.';

    return h('div', null,
      h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.4rem', flexWrap: 'wrap', gap: 10 } },
        h('h1', { style: { fontFamily: 'var(--f-display)', fontWeight: 600, fontSize: 24, color: 'var(--tx-on-dark)' } }, 'Beheer'),
        h('button', { className: 'bl-btn-sm danger', onClick: () => setIsAdmin(false) }, 'Afmelden')
      ),
      h('div', { className: barClass },
        h('p', null, barText),
        h('button', { onClick: exportData }, '⬇ Back-up downloaden')
      ),
      h('div', { className: 'bl-admin-layout', style: { display: 'flex', gap: '1.25rem', alignItems: 'flex-start' } },
        h('div', { className: 'bl-panel bl-admin-sidebar', style: { width: 190, flexShrink: 0, padding: 10 } },
          h('p', { style: { fontSize: 10.5, color: 'var(--tx-on-dark-faint)', letterSpacing: '0.08em', textTransform: 'uppercase', margin: '4px 8px 8px', fontFamily: 'var(--f-mono)' } }, 'Beheer'),
          h('div', { className: 'bl-admin-tabs' },
            ...tabs.map(([v, l]) => h('button', { key: v, className: 'bl-tab-btn' + (adv === v ? ' active' : ''), onClick: () => setAdv(v) }, l))
          )
        ),
        h('div', { style: { flex: 1, minWidth: 0, width: '100%' } },
          adv === 'special' && h(AdminSpecials, { specials, upSpecials }),
          adv === 'gerechten' && h(AdminMenu, { data: dishes, upData: upDishes, label: 'gerecht' }),
          adv === 'dranken' && h(AdminMenu, { data: drinks, upData: upDrinks, label: 'drank' })
        )
      )
    );
  }

  function AdminLogin({ setIsAdmin }) {
    const [pw, setPw] = useState('');
    const [err, setErr] = useState(false);
    const login = () => {
      if (pw.trim() === PASS) { setIsAdmin(true); setErr(false); }
      else setErr(true);
    };
    return h('div', { style: { maxWidth: 360, margin: '3rem auto' } },
      h('div', { className: 'bl-panel', style: { textAlign: 'center' } },
        h('div', { style: { fontSize: 30, marginBottom: 8 } }, '🔒'),
        h('h2', { style: { fontFamily: 'var(--f-display)', fontWeight: 600, fontSize: 19, color: 'var(--tx-on-dark)', marginBottom: 4 } }, 'Aanmelden'),
        h('p', { style: { fontSize: 13, color: 'var(--tx-on-dark-muted)', marginBottom: 20 } }, 'Alleen voor de eigenaar van Bistro Likert'),
        h('div', { style: { textAlign: 'left' } },
          h('label', { className: 'bl-label' }, 'Wachtwoord'),
          h('input', {
            type: 'password', value: pw, className: 'bl-input', autoFocus: true,
            style: { marginBottom: err ? 6 : 14 },
            onChange: (e) => { setPw(e.target.value); setErr(false); },
            onKeyDown: (e) => e.key === 'Enter' && login(),
            placeholder: 'Voer wachtwoord in',
          }),
          err && h('p', { style: { color: '#e0776a', fontSize: 12, marginBottom: 10 } }, 'Ongeldig wachtwoord. Probeer opnieuw.'),
          h('button', { className: 'bl-btn bl-btn-brass', style: { width: '100%' }, onClick: login }, 'Aanmelden'),
          h('p', { style: { fontSize: 11, color: 'var(--tx-on-dark-faint)', marginTop: 14, textAlign: 'center', fontFamily: 'var(--f-mono)' } }, 'Wachtwoord: bistro2024')
        )
      )
    );
  }

  // ─── Admin: Suggesties (meerdere tegelijk) ──────────────────────────────────
  function AdminSpecials({ specials, upSpecials }) {
    const set = (id, k, v) => upSpecials(specials.map((s) => (s.id === id ? { ...s, [k]: v } : s)));
    const addSpecial = () => upSpecials([...specials, { id: uid(), title: 'Nieuwe suggestie', description: '', price: 0, photo: null }]);
    const delSpecial = (id) => { if (window.confirm('Deze suggestie verwijderen?')) upSpecials(specials.filter((s) => s.id !== id)); };
    const handlePhoto = async (id, e) => { const f = e.target.files[0]; if (f) set(id, 'photo', await toB64(f)); };

    return h('div', null,
      h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '1.1rem' } },
        h('h2', { style: { fontSize: 16, fontWeight: 600, color: 'var(--tx-on-dark)' } }, 'Suggesties'),
        h('button', { className: 'bl-btn-sm brass', onClick: addSpecial }, '+ Suggestie toevoegen')
      ),
      specials.length === 0 && h('p', { className: 'bl-panel', style: { color: 'var(--tx-on-dark-faint)', fontSize: 13, textAlign: 'center' } }, 'Nog geen suggesties — klik hierboven om er één toe te voegen.'),
      ...specials.map((s) =>
        h('div', { key: s.id, className: 'bl-panel', style: { marginBottom: '1rem' } },
          h('div', { style: { display: 'grid', gap: 12 } },
            h('div', { style: { display: 'flex', gap: 10, alignItems: 'flex-start' } },
              h('div', { style: { flex: 1 } },
                h('label', { className: 'bl-label' }, 'Naam van het gerecht'),
                h('input', { className: 'bl-input', value: s.title, onChange: (e) => set(s.id, 'title', e.target.value), placeholder: 'Bijv. Gegrilde zalm met kruidenboter' })
              ),
              h('button', { className: 'bl-btn-sm danger', style: { flexShrink: 0, marginTop: 22 }, onClick: () => delSpecial(s.id) }, '🗑 Verwijderen')
            ),
            h('div', null,
              h('label', { className: 'bl-label' }, 'Beschrijving'),
              h('textarea', { className: 'bl-input bl-textarea', value: s.description, onChange: (e) => set(s.id, 'description', e.target.value), placeholder: 'Korte beschrijving van het gerecht…' })
            ),
            h('div', null,
              h('label', { className: 'bl-label' }, 'Prijs (€)'),
              h('input', { className: 'bl-input', style: { width: 130 }, type: 'number', step: '0.5', value: s.price, onChange: (e) => set(s.id, 'price', parseFloat(e.target.value) || 0) })
            ),
            h('div', null,
              h('label', { className: 'bl-label' }, 'Foto (optioneel)'),
              h('input', { type: 'file', accept: 'image/*', onChange: (e) => handlePhoto(s.id, e), style: { fontSize: 13, color: 'var(--tx-on-dark-muted)' } }),
              s.photo && h('div', { style: { display: 'flex', gap: 10, alignItems: 'center', marginTop: 8 } },
                h('img', { src: s.photo, alt: '', style: { width: 100, height: 75, objectFit: 'cover', borderRadius: 8 } }),
                h('button', { className: 'bl-btn-sm danger', onClick: () => set(s.id, 'photo', null) }, 'Verwijderen')
              )
            )
          )
        )
      ),
      h('p', { style: { fontSize: 11.5, color: 'var(--tx-on-dark-faint)', lineHeight: 1.7, marginTop: 6 } }, 'Tip: voor een lichter bestand kan je een foto ook rechtstreeks in de map "images" van je GitHub-repo zetten en hier enkel het pad invullen (bijv. images/mijnfoto.jpg) in plaats van te uploaden.')
    );
  }

  // ─── Admin: Menu (Gerechten / Dranken) ─────────────────────────────────────
  function AdminMenu({ data, upData, label }) {
    const [editing, setEditing] = useState(null);
    const [editForm, setEditForm] = useState({});
    const [newCat, setNewCat] = useState('');
    const setEF = (k, v) => setEditForm((f) => ({ ...f, [k]: v }));

    const startEdit = (catId, item) => { setEditing(`${catId}|${item.id}`); setEditForm({ ...item }); };
    const cancelEdit = () => { setEditing(null); setEditForm({}); };
    const saveEdit = (catId) => {
      upData(data.map((c) => c.id !== catId ? c : { ...c, items: c.items.map((i) => i.id === editForm.id ? { ...editForm, price: parseFloat(editForm.price) || 0 } : i) }));
      cancelEdit();
    };
    const addItem = (catId) => {
      upData(data.map((c) => c.id !== catId ? c : { ...c, items: [...c.items, { id: uid(), name: 'Nieuw item', description: '', price: 5 }] }));
    };
    const delItem = (catId, iid) => {
      upData(data.map((c) => c.id !== catId ? c : { ...c, items: c.items.filter((i) => i.id !== iid) }));
    };
    const setCatNote = (catId, note) => upData(data.map((c) => (c.id !== catId ? c : { ...c, note })));
    const addCat = () => { if (!newCat.trim()) return; upData([...data, { id: uid(), category: newCat.trim(), items: [] }]); setNewCat(''); };
    const delCat = (catId) => { if (!window.confirm('Categorie en alle items verwijderen?')) return; upData(data.filter((c) => c.id !== catId)); };

    return h('div', null,
      h('h2', { style: { fontSize: 16, fontWeight: 600, color: 'var(--tx-on-dark)', marginBottom: '1.2rem' } }, label === 'drank' ? 'Dranken beheren' : 'Gerechten beheren'),
      ...data.map((cat) =>
        h('div', { key: cat.id, className: 'bl-panel', style: { marginBottom: '1rem', padding: '1.1rem' } },
          h('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8, gap: 8, flexWrap: 'wrap' } },
            h('span', { style: { fontWeight: 600, fontSize: 14, color: 'var(--tx-on-dark)' } }, cat.category),
            h('div', { style: { display: 'flex', gap: 6 } },
              h('button', { className: 'bl-btn-sm', onClick: () => addItem(cat.id) }, `+ ${label === 'drank' ? 'Drank' : 'Gerecht'}`),
              h('button', { className: 'bl-btn-sm danger', onClick: () => delCat(cat.id) }, '✕')
            )
          ),
          h('input', { className: 'bl-input', style: { fontSize: 12.5, marginBottom: 10, fontStyle: 'italic' }, value: cat.note || '', placeholder: 'Opmerking bij categorie (optioneel)', onChange: (e) => setCatNote(cat.id, e.target.value) }),
          ...cat.items.map((item) => {
            const key = `${cat.id}|${item.id}`;
            if (editing === key) {
              return h('div', { key: item.id, style: { background: 'rgba(255,255,255,0.06)', borderRadius: 10, padding: 10, marginBottom: 6 } },
                h('div', { style: { display: 'grid', gap: 8 } },
                  h('div', { style: { display: 'flex', gap: 8, flexWrap: 'wrap' } },
                    h('input', { className: 'bl-input', style: { flex: 2, minWidth: 140 }, value: editForm.name || '', onChange: (e) => setEF('name', e.target.value), placeholder: 'Naam' }),
                    h('input', { className: 'bl-input', style: { width: 90 }, type: 'number', step: '0.5', value: editForm.price || '', onChange: (e) => setEF('price', e.target.value), placeholder: 'Prijs' })
                  ),
                  h('input', { className: 'bl-input', value: editForm.description || '', onChange: (e) => setEF('description', e.target.value), placeholder: 'Beschrijving (optioneel)' }),
                  h('div', { style: { display: 'flex', gap: 6 } },
                    h('button', { className: 'bl-btn-sm brass', onClick: () => saveEdit(cat.id) }, 'Opslaan'),
                    h('button', { className: 'bl-btn-sm', onClick: cancelEdit }, 'Annuleren')
                  )
                )
              );
            }
            return h('div', { key: item.id, className: 'bl-adminrow' },
              h('div', { style: { flex: 1, minWidth: 0 } },
                h('span', { style: { fontWeight: 600, color: 'var(--tx-on-dark)' } }, item.name),
                item.description && h('span', { style: { color: 'var(--tx-on-dark-faint)', marginLeft: 6, fontSize: 12 } }, item.description)
              ),
              h('span', { style: { fontFamily: 'var(--f-mono)', color: 'var(--brass-light)', fontWeight: 600, fontSize: 13 } }, eur(item.price)),
              h('div', { style: { display: 'flex', gap: 4 } },
                h('button', { className: 'bl-btn-sm', style: { padding: '4px 8px' }, onClick: () => startEdit(cat.id, item) }, '✏️'),
                h('button', { className: 'bl-btn-sm danger', style: { padding: '4px 8px' }, onClick: () => delItem(cat.id, item.id) }, '🗑')
              )
            );
          }),
          cat.items.length === 0 && h('p', { style: { color: 'var(--tx-on-dark-faint)', fontSize: 13, textAlign: 'center', padding: '0.5rem 0' } }, `Geen items — klik op "+ ${label === 'drank' ? 'Drank' : 'Gerecht'}" om toe te voegen.`)
        )
      ),
      h('div', { className: 'bl-panel', style: { display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' } },
        h('input', { className: 'bl-input', style: { flex: 1, minWidth: 160 }, value: newCat, onChange: (e) => setNewCat(e.target.value), onKeyDown: (e) => e.key === 'Enter' && addCat(), placeholder: label === 'drank' ? 'Nieuwe categorie (bijv. Cocktails)' : 'Nieuwe categorie (bijv. Soepen)' }),
        h('button', { className: 'bl-btn bl-btn-brass', style: { flexShrink: 0 }, onClick: addCat }, '+ Categorie')
      )
    );
  }

  ReactDOM.render(h(App), document.getElementById('root'));
</script>
